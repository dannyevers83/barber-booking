# ─── Public demo web service ────────────────────────────────────────

services:
  - type: web
    name: oak-and-steel-demo
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --prefix frontend --include=dev && npm run build --prefix frontend && npm ci --prefix backend
    startCommand: npm start --prefix backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: NODE_ENV
        value: production
      - key: AUTO_MIGRATE
        value: 'true'
      - key: DATABASE_URL
        # Managed as a secret in Render. This also supports an external Neon database.
        # Existing values are preserved; enter the Neon URL only after restoring data.
        sync: false

# ─── Original database retained after the Neon transfer ──────────────

# Retained temporarily as a rollback copy; the app now connects to Neon.
databases:
  - name: oak-and-steel-demo-db
    plan: free
    region: frankfurt
    postgresMajorVersion: '18'
    databaseName: barber_booking
    user: barber_app
    ipAllowList: []
