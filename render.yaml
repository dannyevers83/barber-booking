services:
  - type: web
    name: oak-and-steel-demo
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --prefix frontend --include=dev && npm run build --prefix frontend && npm ci --prefix backend
    startCommand: npm start --prefix backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: NODE_ENV
        value: production
      - key: AUTO_MIGRATE
        value: 'true'
      - key: DATABASE_URL
        fromDatabase:
          name: oak-and-steel-demo-db
          property: connectionString

databases:
  - name: oak-and-steel-demo-db
    plan: free
    region: frankfurt
    postgresMajorVersion: '18'
    databaseName: barber_booking
    user: barber_app
    ipAllowList: []
